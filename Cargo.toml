[package]
name = "cubase_mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Transport-independent MCP integration daemon for Cubase"
license = "MIT"

[dependencies]
dirs = "6.0"
midir = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
