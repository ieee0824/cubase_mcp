name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux MIDI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Check evidence scripts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/check-input-guard-calibration.sh
          bash -n scripts/check-track-probe-evidence.sh
          node tests/track_probe_evidence_checker.test.js

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: |
          # The production input guard is macOS-only. Its aggregate-sample
          # helper remains available on other platforms solely for unit tests,
          # so only that regular non-test binary has an intentional dead item.
          cargo clippy --all-targets --locked -- -D warnings -A dead-code
          cargo clippy --locked --lib --tests --benches --examples \
            --bin cubase_mcp \
            --bin cubase_bridge_mock \
            --bin cubase_track_probe_audit \
            --bin cubase_track_probe_collector \
            -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets --locked

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Test Cubase MIDI Remote script
        if: runner.os == 'Linux'
        run: |
          node tests/midi_remote_script.test.js
          node tests/track_probe_script.test.js

      - name: Test macOS input-guard evidence checker
        if: runner.os == 'macOS'
        run: node tests/input_guard_calibration_checker.test.js
